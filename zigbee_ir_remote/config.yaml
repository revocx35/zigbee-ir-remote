name: Zigbee IR Remote
version: "1.2.1"
slug: zigbee_ir_remote
description: Learn and manage IR codes for Zigbee2MQTT IR blasters (Tuya ZS06 / UFO-R11 etc.), with smart room climate control
url: https://github.com/revocx35/zigbee-ir-remote
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:remote-tv
panel_title: IR Remote
homeassistant_api: true
options:
  z2m_base_topic: zigbee2mqtt
  learn_timeout: 30
  expose_buttons: true
  discovery_prefix: homeassistant
schema:
  z2m_base_topic: str
  learn_timeout: int(5,120)
  expose_buttons: bool
  discovery_prefix: str
