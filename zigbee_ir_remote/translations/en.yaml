configuration:
  z2m_base_topic:
    name: Zigbee2MQTT base topic
    description: MQTT base topic of Zigbee2MQTT (default "zigbee2mqtt").
  learn_timeout:
    name: Learn timeout (seconds)
    description: How long to wait for a remote button press while learning.
  expose_buttons:
    name: Expose controls to Home Assistant
    description: Publish every learned control as an MQTT button entity (or one select entity per full-config AC) so you can use it in dashboards and automations. Climate regions are always published.
  discovery_prefix:
    name: MQTT discovery prefix
    description: Home Assistant MQTT discovery prefix (default "homeassistant").
  agent_api_hosts:
    name: Agent API host names
    description: Extra host names or addresses AI agents use to reach the agent API, comma separated (the host's own addresses and Home Assistant's URLs are added automatically). They go into the API's certificate.
network:
  8098/tcp: Agent API (MCP over HTTPS) for AI agents such as Jarvis. It answers only with a token made in the app's Settings.
